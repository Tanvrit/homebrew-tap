# Bumps Formula/tanvrit.rb to a new version and pins every platform sha256 from
# the tarballs actually published on dl.tanvrit.com. Invoked by the private app
# repo's release workflow via repository_dispatch (event-type: bump-formula,
# client-payload {version}), or run manually with a version input.
name: Bump tanvrit formula
on:
  repository_dispatch:
    types: [bump-formula]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pin, e.g. 1.5.33"
        required: true
permissions:
  contents: write
jobs:
  bump:
    # Self-hosted only — org policy 2026-09-11. Public repo: queues until the
    # runner group is opened to public repos. Never a GitHub-hosted image.
    runs-on:
      group: tanvrit
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pin version and per-platform sha256
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
        run: |
          set -euo pipefail
          [ -n "${VERSION:-}" ] || { echo "::error::no version supplied"; exit 1; }
          VERSION="${VERSION#v}"   # accept either v1.5.33 (release tag) or 1.5.33
          # One idempotent pass: set the version, then for each platform download
          # the real tarball, hash it, and rewrite the sha256 line under that
          # platform's url — whether it currently holds a REPLACE_ON_RELEASE_*
          # placeholder or a previously-pinned hash. A missing tarball fails the
          # whole job, so the formula is never pushed half-broken.
          python3 - "Formula/tanvrit.rb" "$VERSION" <<'PY'
          import re, sys, urllib.request, hashlib
          path, ver = sys.argv[1], sys.argv[2]
          s = open(path).read()
          s = re.sub(r'^(  version )"[^"]*"', rf'\1"{ver}"', s, count=1, flags=re.M)
          for suffix in ("macOS-arm64", "macOS-x64", "Linux-arm64", "Linux-x64"):
              url = f"https://dl.tanvrit.com/ai/manual/tanvrit-cli-{ver}-{suffix}.tar.gz"
              print(f"fetching {url}", flush=True)
              try:
                  data = urllib.request.urlopen(url, timeout=180).read()
              except Exception as e:
                  sys.exit(f"::error::missing artifact {url}: {e} — not pinning a half-broken formula")
              sha = hashlib.sha256(data).hexdigest()
              # match `...-<suffix>.tar.gz"` then the sha256 line right below it
              pat = re.compile(rf'(-{re.escape(suffix)}\.tar\.gz"\n\s*sha256 )"[^"]*"')
              s, n = pat.subn(rf'\g<1>"{sha}"', s, count=1)
              if n != 1:
                  sys.exit(f"::error::could not locate the sha256 line for {suffix}")
              print(f"  {suffix} -> {sha}")
          open(path, "w").write(s)
          PY
          echo "=== result ==="; grep -nE 'version |url |sha256' Formula/tanvrit.rb
      - name: Commit
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
        run: |
          git config user.name "tanvrit-release-bot"
          git config user.email "release@tanvrit.com"
          git add Formula/tanvrit.rb
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "chore(formula): tanvrit ${VERSION} [skip ci]"
          git push origin HEAD:main
