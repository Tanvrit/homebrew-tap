# Bumps Formula/tanvrit.rb to a new version and pins every platform sha256 from
# the tarballs actually published on dl.tanvrit.com. Invoked by the private app
# repo's release workflow via repository_dispatch (event-type: bump-formula,
# client-payload {version}), or run manually with a version input.
name: Bump tanvrit formula
on:
  repository_dispatch:
    types: [bump-formula]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pin, e.g. 1.5.33"
        required: true
permissions:
  contents: write
jobs:
  bump:
    # Self-hosted only — org policy 2026-09-11. Public repo: queues until the
    # runner group is opened to public repos. Never a GitHub-hosted image.
    runs-on:
      group: tanvrit
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pin version and per-platform sha256
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
        run: |
          set -euo pipefail
          [ -n "${VERSION:-}" ] || { echo "::error::no version supplied"; exit 1; }
          F=Formula/tanvrit.rb
          sed -i "s/^  version \"[^\"]*\"/  version \"${VERSION}\"/" "$F"
          declare -A SUFFIX=(
            [MACOS_ARM64]="macOS-arm64" [MACOS_X64]="macOS-x64"
            [LINUX_ARM64]="Linux-arm64" [LINUX_X64]="Linux-x64" )
          for key in "${!SUFFIX[@]}"; do
            url="https://dl.tanvrit.com/ai/manual/tanvrit-cli-${VERSION}-${SUFFIX[$key]}.tar.gz"
            echo "Fetching $url"
            if ! curl -fsSL -o /tmp/a.tgz "$url"; then
              echo "::error::missing artifact $url — the release did not publish this platform's CLI tarball. Not pinning a half-broken formula."
              exit 1
            fi
            sha=$(sha256sum /tmp/a.tgz | awk '{print $1}')
            # Replace the placeholder OR a previously-pinned 64-hex sha on this platform's line.
            sed -i "s/REPLACE_ON_RELEASE_${key}/${sha}/; " "$F"
            awk -v k="$key" -v sha="$sha" '
              BEGIN{IGNORECASE=0}
              { print }
            ' "$F" >/dev/null
          done
          # For re-bumps (already-pinned shas), rewrite each sha line under its url.
          python3 - "$F" "$VERSION" <<'PY'
import re,sys,subprocess,urllib.request,hashlib
f,ver=sys.argv[1],sys.argv[2]
s=open(f).read()
suf={'macOS-arm64':None,'macOS-x64':None,'Linux-arm64':None,'Linux-x64':None}
for p in list(suf):
    u=f"https://dl.tanvrit.com/ai/manual/tanvrit-cli-{ver}-{p}.tar.gz"
    try:
        d=urllib.request.urlopen(u,timeout=120).read(); suf[p]=hashlib.sha256(d).hexdigest()
    except Exception as e:
        print(f"::error::{u}: {e}"); sys.exit(1)
def repl(m):
    p=m.group(1); sha=suf[p]; return m.group(0).split('sha256')[0]+f'sha256 "{sha}"'
s=re.sub(r'tanvrit-cli-#\{version\}-(macOS-arm64|macOS-x64|Linux-arm64|Linux-x64)\.tar\.gz"\n(\s*)sha256 "[^"]*"',
         lambda m: m.group(0).rsplit('sha256',1)[0]+f'sha256 "{suf[m.group(1)]}"', s)
open(f,'w').write(s)
PY
          echo "=== result ==="; grep -nE 'version |url |sha256' "$F"
      - name: Commit
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
        run: |
          git config user.name "tanvrit-release-bot"
          git config user.email "release@tanvrit.com"
          git add Formula/tanvrit.rb
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "chore(formula): tanvrit ${VERSION} [skip ci]"
          git push origin HEAD:main
